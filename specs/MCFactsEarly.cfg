\* A limit: a node drops a mark at each moment, as after a split that is longer than the time of a mark. The checker must find an older change that brings the fact back.
SPECIFICATION Spec
CONSTANTS
    Nodes = {1, 2}
    Keys = {k1}
    Changes = 2
    Splits = 1
    Steps = {1, 2}
    ByNode = TRUE
    Marks = TRUE
    Wait = FALSE
INVARIANT NoReturn
