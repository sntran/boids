\* The fault model: a node always keeps its process. After a split, two processes can stop for each other: the checker must find that the boid has no process.
SPECIFICATION Spec
CONSTANTS
    Nodes = {n1, n2}
    Crossings = 3
    Splits = 1
    Stops = 0
    None = None
    Ages = FALSE
    Yields = TRUE
    Exact = TRUE
INVARIANT NotLost
