\* The fault model: a node that is told to stop its process stops a process of each age. The checker must find that the boid has no process.
SPECIFICATION Spec
CONSTANTS
    Nodes = {1, 2, 3}
    Crossings = 3
    Splits = 1
    Apart = FALSE
    Tiles = FALSE
    Announce = TRUE
    Exact = FALSE
INVARIANT NotLost
