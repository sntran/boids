\* The fault model: a node that is told to stop its process stops a process of each age. A process that came after the decision then stops: the checker must find that the boid has no process.
SPECIFICATION Spec
CONSTANTS
    Nodes = {n1, n2}
    Crossings = 3
    Splits = 1
    Stops = 0
    None = None
    Ages = TRUE
    Yields = TRUE
    Exact = FALSE
INVARIANT NotLost
