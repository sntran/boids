name: CI

# One run for each push to a branch. A pull request from a fork runs too:
# a pull request from a branch of this repository has the run of its push.
on:
  push:
    paths-ignore:
      - "**.md"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "**.md"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The tests on the supported Erlang/OTP. The tests are ExUnit tests of
  # the Erlang code, the model checks of specs/ and the replay of the
  # world (docs/specs.md).
  test:
    name: Tests (OTP ${{ matrix.otp }}, Elixir ${{ matrix.elixir }})
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - otp: "29"
            elixir: "1.20"
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        id: beam
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            deps
            _build
          key: mix-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('mix.lock') }}
      - name: Get the dependencies
        run: mix deps.get
      - name: Check the format
        run: mix format --check-formatted
      # The tests must cover all the lines of the Erlang code.
      - name: Run the tests
        run: mix test --cover

  # The build of a rebar3 project, as an Erlang user has it, with the
  # checks of rebar3: calls to functions that do not exist (xref), and
  # the types (dialyzer).
  rebar3:
    name: rebar3 (compile, xref, dialyzer)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        id: beam
        with:
          otp-version: "29"
          rebar3-version: "3"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/rebar3
          key: rebar3-plt-${{ steps.beam.outputs.otp-version }}
      - run: rebar3 compile
      - run: rebar3 xref
      - run: rebar3 dialyzer

  # The examples (examples/): the games of the showcases, the site that
  # shows them, and the build of the file that runs on Cloudflare
  # Workers. The tests start each game with the library of this commit,
  # so a change of the library that breaks an example fails here.
  examples:
    name: Examples (tests of each game, build of app.com)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: examples
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: "29"
          elixir-version: "1.20"
      - name: Get the dependencies
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
      - name: Check the format
        run: mix format --check-formatted
      - name: Run the tests
        run: mix test
      - name: Build app.com
        run: |
          npm install --no-audit --no-fund
          npm run build

  # The tests with beam.com as the only tool: Erlang/OTP, Elixir, Mix, Hex
  # and rebar3 in one file (https://github.com/sntran/BEAM.com).
  beam-com:
    name: Tests (beam.com)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MIX_ENV: test
      # A fixed build of beam.com with Hex and rebar3: the kept file of
      # the build URL https://mkfifo.com/beam.com?hex=1&rebar3=1&debug_info=1&apps+=eunit,dialyzer,edoc
      # (docs/BUILDING.md of BEAM.com, "A fixed version of a build").
      BEAM_COM_SHA256: c3b6f8fd0f4ecbc3e1ec30a159218f45b566d844820c64135aacb50d4a57e1d2
      BEAM_COM_RELEASE: https://github.com/sntran/BEAM.com/releases/download/kept-202611
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Mix runs mix.com as a program: an ELF copy of beam.com
      # (--assimilate) is that program on the runner.
      - name: Get beam.com with Hex and rebar3
        run: |
          mkdir -p "$RUNNER_TEMP/tools"
          curl --retry 5 -fsSL -o "$RUNNER_TEMP/tools/beam.com" "$BEAM_COM_RELEASE/beam-$BEAM_COM_SHA256.com"
          echo "$BEAM_COM_SHA256  $RUNNER_TEMP/tools/beam.com" | sha256sum -c -
          sh "$RUNNER_TEMP/tools/beam.com" --assimilate
          chmod +x "$RUNNER_TEMP/tools/beam.com"
          ln -sf "$RUNNER_TEMP/tools/beam.com" "$RUNNER_TEMP/tools/mix.com"
          echo "$RUNNER_TEMP/tools" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/tools/beam.com" --version
      - name: Get the dependencies
        run: mix.com deps.get
      - name: Run the tests
        run: mix.com test --cover
