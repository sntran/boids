name: Deploy the site

# Deploy the site (examples/) to Cloudflare Workers when the workflow "CI"
# is good on main, and when a person starts the workflow. CI has the tests
# of the examples and the check of each page on a phone: a commit that
# fails them is not deployed.
# It needs the secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID of
# the repository. Without them, the workflow does nothing.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time. A new push waits for the deploy that runs.
concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: examples
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check the secrets
        id: secrets
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::The secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not set: no deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
        working-directory: .
      # The commit that CI checked.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.secrets.outputs.ready == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Get beam.com and wrangler
        if: steps.secrets.outputs.ready == 'true'
        run: npm install --no-audit --no-fund
      # beam.com makes app.com: the release of the site in one file, with
      # its WebAssembly part.
      - name: Build app.com
        if: steps.secrets.outputs.ready == 'true'
        run: npm run build
      - name: Deploy
        if: steps.secrets.outputs.ready == 'true'
        run: npx wrangler deploy
